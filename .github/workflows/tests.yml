name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentph_test
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: rentph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentph_test -d rentph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rentph_test:integration-test-only@127.0.0.1:5432/rentph_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -mod=mod -count=1 ./...
      - run: go vet -mod=mod ./...
      - run: go mod verify
      - run: go build -mod=mod .
